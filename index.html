<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="hearts-background"></div>
        
        <div class="content" id="question-content">
            <h1 class="title">💝 Will spink be my Valentine? 💝</h1>
            <div class="image-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcXVpbnZvZ2Y2Y3l1dGZ5OHRneTM1cjZ6ZDFmMWdvdmV1YXNsMG1mYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="cute cat" class="cute-image">
            </div>
            <div class="buttons">
                <button class="btn btn-yes" id="yes-btn">Yes! 💖</button>
                <button class="btn btn-no" id="no-btn">No</button>
            </div>
        </div>

        <div class="content hidden" id="success-content">
            <h1 class="title">🎉 Yay! I knew you'd say yes! 🎉</h1>
            <div class="image-container">
                <img src="us.jpg" alt="us together" class="cute-image">
            </div>
            <p class="success-message">I'm so excited to spend Valentine's Day with you Sponk! ❤️</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
